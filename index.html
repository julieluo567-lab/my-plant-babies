<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-50: #f0faf4;
    --green-100: #d4f0e0;
    --green-200: #a8dfc1;
    --green-500: #3a9e6f;
    --green-700: #1e6b47;
    --green-900: #0d3a26;
    --amber-50: #fffbeb;
    --amber-400: #d4a017;
    --amber-700: #92600a;
    --red-50: #fff1f0;
    --red-400: #e05252;
    --red-700: #9b2222;
    --ink: #1a1f18;
    --ink-muted: #4a5248;
    --ink-faint: #8a9287;
    --paper: #f7f9f5;
    --surface: #ffffff;
    --border: #dde5d8;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Sidebar layout ── */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--green-900);
    display: flex;
    flex-direction: column;
    padding: 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }

  .sidebar-brand {
    padding: 28px 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-brand .logo-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .sidebar-brand .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  .sidebar-plants {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-plants::-webkit-scrollbar { width: 4px; }
  .sidebar-plants::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .sidebar-section-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.3);
    padding: 8px 24px 4px;
    text-transform: uppercase;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    border-radius: 0;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.07); }
  .sidebar-item.active {
    background: rgba(255,255,255,0.1);
    border-left-color: var(--green-200);
  }
  .sidebar-item .si-emoji { font-size: 18px; width: 24px; text-align: center; }
  .sidebar-item .si-info { flex: 1; min-width: 0; }
  .sidebar-item .si-name { font-size: 13px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-item .si-status { font-size: 11px; margin-top: 1px; }
  .si-status-ok { color: var(--green-200); }
  .si-status-soon { color: #fcd34d; }
  .si-status-overdue { color: #fca5a5; }

  .sidebar-add {
    margin: 8px 16px 0;
    background: rgba(255,255,255,0.08);
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 8px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .sidebar-add:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.85); }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px;
    color: rgba(255,255,255,0.25);
  }

  /* ── Main content ── */
  .main {
    margin-left: 260px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .topbar-title { font-size: 16px; font-weight: 500; color: var(--ink); }
  .topbar-actions { display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 7px;
    font-size: 13px; font-weight: 400;
    cursor: pointer; border: none; transition: all 0.15s;
  }
  .btn-primary { background: var(--green-500); color: #fff; }
  .btn-primary:hover { background: var(--green-700); }
  .btn-secondary { background: transparent; color: var(--ink-muted); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--green-50); border-color: var(--green-200); color: var(--green-700); }
  .btn-danger { background: var(--red-50); color: var(--red-700); border: 1px solid #fca5a5; }
  .btn-danger:hover { background: #fee2e2; }

  .content { padding: 28px 32px; flex: 1; }

  /* ── Empty / Welcome state ── */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
  }
  .welcome-icon { font-size: 56px; margin-bottom: 16px; }
  .welcome h2 { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .welcome p { color: var(--ink-muted); font-size: 14px; margin-bottom: 24px; max-width: 300px; line-height: 1.7; }

  /* ── Plant detail ── */
  .plant-hero {
    display: flex;
    align-items: flex-start;
    gap: 24px;
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .plant-avatar {
    width: 80px; height: 80px; border-radius: 16px;
    background: var(--green-100);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    flex-shrink: 0;
  }
  .plant-meta { flex: 1; }
  .plant-meta h2 { font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
  .plant-meta .species { font-size: 14px; color: var(--ink-muted); margin-bottom: 12px; }
  .plant-badges { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 400;
  }
  .badge-ok { background: var(--green-100); color: var(--green-700); }
  .badge-soon { background: var(--amber-50); color: var(--amber-700); }
  .badge-overdue { background: var(--red-50); color: var(--red-700); }
  .badge-interval { background: #f0f0f0; color: var(--ink-muted); }

  /* ── Stats row ── */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 300; color: var(--ink); line-height: 1; margin-bottom: 4px; font-family: 'Noto Serif SC', serif; }
  .stat-unit { font-size: 12px; color: var(--ink-muted); }

  /* ── Action strip ── */
  .action-strip {
    display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap;
  }

  /* ── Log timeline ── */
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .log-header h3 { font-size: 14px; font-weight: 500; color: var(--ink); letter-spacing: 0.04em; }

  .timeline { position: relative; padding-left: 28px; }
  .timeline::before {
    content: '';
    position: absolute; left: 8px; top: 8px; bottom: 8px;
    width: 1px; background: var(--border);
  }
  .tl-item {
    position: relative;
    padding: 0 0 20px;
  }
  .tl-dot {
    position: absolute; left: -24px; top: 4px;
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
  }
  .tl-dot-water { background: var(--green-500); }
  .tl-dot-growth { background: #6bbf5e; }
  .tl-dot-note { background: var(--amber-400); }

  .tl-date { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .tl-content { font-size: 14px; color: var(--ink); line-height: 1.6; }
  .tl-content .tl-type { font-weight: 500; }
  .tl-type-water { color: var(--green-700); }
  .tl-type-growth { color: #3d8e30; }
  .tl-type-note { color: var(--amber-700); }

  .log-empty { color: var(--ink-faint); font-size: 13px; text-align: center; padding: 32px 0; }

  /* ── Modals ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,20,10,0.4);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--surface);
    border-radius: 16px;
    padding: 28px;
    width: 400px;
    max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal h2 { font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 500; margin-bottom: 20px; color: var(--ink); }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: 6px; letter-spacing: 0.04em; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; color: var(--ink);
    background: var(--surface);
    font-family: 'Noto Sans SC', sans-serif;
    transition: border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline: none; border-color: var(--green-500);
  }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  .emoji-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px;
  }
  .emoji-btn {
    height: 38px; border-radius: 7px; border: 1px solid var(--border);
    background: transparent; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  .emoji-btn:hover { background: var(--green-50); border-color: var(--green-200); }
  .emoji-btn.active { background: var(--green-100); border-color: var(--green-500); }

  .type-switcher { display: flex; gap: 6px; margin-bottom: 16px; }
  .type-btn {
    flex: 1; padding: 8px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent;
    font-size: 13px; color: var(--ink-muted); cursor: pointer;
    transition: all 0.15s; text-align: center;
  }
  .type-btn.active { background: var(--green-100); border-color: var(--green-500); color: var(--green-700); }

  .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
  .modal-footer .btn { flex: 1; justify-content: center; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--green-900); color: #fff;
    padding: 10px 20px; border-radius: 24px;
    font-size: 13px; z-index: 999;
    animation: fadeInUp 0.2s ease, fadeOut 0.3s ease 1.8s forwards;
    pointer-events: none;
  }
  @keyframes fadeInUp { from { opacity:0; transform:translate(-50%, 12px); } to { opacity:1; transform:translate(-50%,0); } }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ── Responsive ── */
  @media (max-width: 720px) {
    .sidebar { width: 0; overflow: hidden; }
    .main { margin-left: 0; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .content { padding: 20px 16px; }
    .topbar { padding: 0 16px; }
  }

  /* ── Auth page ── */
  #authPage {
    display: none;
    min-height: 100vh;
    background: var(--paper);
    align-items: center;
    justify-content: center;
  }
  #authPage.visible { display: flex; }

  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 8px 40px rgba(0,0,0,0.07);
  }
  .auth-logo {
    text-align: center;
    margin-bottom: 28px;
  }
  .auth-logo .logo-emoji { font-size: 36px; margin-bottom: 8px; }
  .auth-logo h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px; font-weight: 500;
    color: var(--ink);
  }
  .auth-logo p { font-size: 13px; color: var(--ink-faint); margin-top: 4px; }

  .auth-tabs {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .auth-tab {
    flex: 1; padding: 9px;
    text-align: center; font-size: 13px;
    cursor: pointer; border: none;
    background: transparent; color: var(--ink-muted);
    transition: all 0.15s;
  }
  .auth-tab.active {
    background: var(--green-900);
    color: #fff;
  }

  .auth-error {
    background: var(--red-50);
    border: 1px solid #fca5a5;
    color: var(--red-700);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.visible { display: block; }

  .auth-submit {
    width: 100%; padding: 11px;
    background: var(--green-500); color: #fff;
    border: none; border-radius: 9px;
    font-size: 14px; font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer; margin-top: 4px;
    transition: background 0.15s;
  }
  .auth-submit:hover { background: var(--green-700); }
  .auth-submit:disabled { background: var(--green-200); cursor: not-allowed; }

  .auth-hint {
    text-align: center; font-size: 12px;
    color: var(--ink-faint); margin-top: 16px;
    line-height: 1.6;
  }

  /* ── App hidden until authed ── */
  #appPage { display: none; }
  #appPage.visible { display: flex; }

  /* ── User chip in topbar ── */
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-muted);
  }
  .user-chip .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--green-100);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--green-700); font-weight: 500;
  }
  .btn-signout {
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; border: 1px solid var(--border);
    background: transparent; color: var(--ink-faint);
    cursor: pointer; transition: all 0.15s;
  }
  .btn-signout:hover { background: var(--red-50); border-color: #fca5a5; color: var(--red-700); }

  /* ── Config banner ── */
  .config-banner {
    background: #fff8e1; border-bottom: 1px solid #ffe082;
    padding: 10px 24px; font-size: 12px; color: #795548;
    display: flex; align-items: center; gap: 8px;
  }
  .config-banner code {
    background: rgba(0,0,0,0.06); padding: 1px 5px;
    border-radius: 3px; font-size: 11px;
  }
</style>
</head>
<body>

<!-- Config banner (shown when Supabase not configured) -->
<div class="config-banner" id="configBanner" style="display:none">
  ⚠️ 请在代码顶部填写你的 Supabase <code>SUPABASE_URL</code> 和 <code>SUPABASE_ANON_KEY</code>，才能启用多用户功能。
</div>

<!-- Auth Page -->
<div id="authPage">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-emoji">🌿</div>
      <h1>植物日记</h1>
      <p>记录每一次浇水与生长</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="authEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group" id="displayNameGroup" style="display:none">
      <label>昵称（可选）</label>
      <input type="text" id="authDisplayName" placeholder="怎么称呼你？">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="authPassword" placeholder="至少 6 位" autocomplete="current-password">
    </div>

    <button class="auth-submit" id="authSubmit" onclick="handleAuth()">登录</button>
    <div class="auth-hint" id="authHint">还没有账号？点上方"注册"创建一个。</div>
  </div>
</div>

<!-- App Page -->
<div class="layout" id="appPage">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-text">🌿 植物日记</div>
      <div class="logo-sub">PLANT CARE JOURNAL</div>
    </div>
    <div class="sidebar-plants" id="sidebarList"></div>
    <div class="sidebar-add" onclick="openAddModal()">＋ 添加新植物</div>
    <div class="sidebar-footer" id="sidebarFooter">正在连接...</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">植物日记</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="content" id="mainContent">
      <div class="welcome">
        <div class="welcome-icon">🪴</div>
        <h2>开始记录你的植物</h2>
        <p>添加你的第一株植物，记录每次浇水和生长变化，再也不会忘记了。</p>
        <button class="btn btn-primary" onclick="openAddModal()">添加第一株植物</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal container -->
<div id="modalContainer"></div>

<script>
// ═══════════════════════════════════════════════
//  配置区：填入你的 Supabase 项目信息
// ═══════════════════════════════════════════════
const SUPABASE_URL  = 'https://dlvjkpvouflxlswibaix.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdmprcHZvdWZseGxzd2liYWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDkzNjYsImV4cCI6MjA5Njc4NTM2Nn0.fDdD_xkC1abxidm6U6YzfZQ5joQWehwjukb78tiQ0VY';
// ═══════════════════════════════════════════════

// ── Supabase 初始化 ──
let sb = null;
let currentUser = null;
const configured = SUPABASE_URL && SUPABASE_ANON_KEY;

if (configured) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  document.getElementById('configBanner').style.display = 'flex';
}

// ── Auth 页面逻辑 ──
let authMode = 'login';

function switchTab(mode) {
  authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
  document.getElementById('displayNameGroup').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('authSubmit').textContent = mode === 'login' ? '登录' : '创建账号';
  document.getElementById('authHint').textContent = mode === 'login'
    ? '还没有账号？点上方"注册"创建一个。'
    : '已有账号？点上方"登录"直接进入。';
  clearAuthError();
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('visible');
}
function clearAuthError() {
  document.getElementById('authError').classList.remove('visible');
}

async function handleAuth() {
  if (!configured) { showAuthError('请先配置 Supabase URL 和 Key。'); return; }

  const email    = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const name     = document.getElementById('authDisplayName').value.trim();

  if (!email || !password) { showAuthError('请填写邮箱和密码。'); return; }
  if (password.length < 6) { showAuthError('密码至少需要 6 位。'); return; }

  const btn = document.getElementById('authSubmit');
  btn.disabled = true;
  btn.textContent = '请稍候...';
  clearAuthError();

  try {
    if (authMode === 'login') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { display_name: name || email.split('@')[0] } }
      });
      if (error) throw error;
      if (data.user && !data.session) {
        // 需要邮件验证
        btn.disabled = false;
        btn.textContent = '创建账号';
        showAuthError('注册成功！请检查邮箱并点击验证链接后再登录。');
        return;
      }
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '登录' : '创建账号';
    const msgMap = {
      'Invalid login credentials': '邮箱或密码错误，请重试。',
      'Email not confirmed': '邮箱尚未验证，请查收验证邮件。',
      'User already registered': '该邮箱已注册，请直接登录。',
    };
    showAuthError(msgMap[err.message] || err.message);
  }
}

// Enter 键提交
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('authPage').classList.contains('visible')) {
    handleAuth();
  }
});

// ── 页面路由：根据登录状态显示 auth 或 app ──
function showAuth() {
  document.getElementById('authPage').classList.add('visible');
  document.getElementById('appPage').classList.remove('visible');
}

function showApp(user) {
  currentUser = user;
  document.getElementById('authPage').classList.remove('visible');
  document.getElementById('appPage').classList.add('visible');

  // 顶栏用户信息
  const initial = (user.user_metadata?.display_name || user.email || '?')[0].toUpperCase();
  const displayName = user.user_metadata?.display_name || user.email;
  document.getElementById('topbarActions').innerHTML = `
    <div class="user-chip">
      <div class="avatar">${initial}</div>
      <span>${displayName}</span>
    </div>
    <button class="btn-signout" onclick="signOut()">退出</button>`;

  document.getElementById('sidebarFooter').textContent = `已登录：${user.email}`;

  loadPlants();
}

async function signOut() {
  if (sb) await sb.auth.signOut();
  currentUser = null;
  showAuth();
}

// ── 监听 Supabase 会话状态 ──
async function initAuth() {
  if (!configured) {
    // 未配置：直接进入 app（保持 localStorage 单用户模式）
    showApp({ email: '本地用户', user_metadata: { display_name: '本地模式' } });
    document.getElementById('sidebarFooter').textContent = '数据保存在本地浏览器';
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    showApp(session.user);
  } else {
    showAuth();
  }

  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      showApp(session.user);
    } else if (event === 'SIGNED_OUT') {
      showAuth();
    }
  });
}

// ══════════════════════════════════════════════
//  植物数据层：Supabase 读写
//  内存中的 plants 数组结构保持不变，UI 层零改动
//  字段映射：water_interval↔waterInterval, created_at↔added
// ══════════════════════════════════════════════

const EMOJIS = ['🌵','🌿','🍀','🌸','🌺','🌻','🌹','🌷','🎋','🎍','🍃','🌱','🪴','🌾','🪸','🌳','🌴','🍄','🌲','🌼','🌑','🫘'];
let plants = [];
let selectedId = null;
let selectedEmoji = '🌱';
let noteType = 'note';

// ── 从 Supabase 行映射为 UI 用的 plant 对象 ──
function rowToPlant(row, logs) {
  return {
    id:            row.id,
    name:          row.name,
    species:       row.species,
    emoji:         row.emoji,
    waterInterval: row.water_interval,
    added:         row.created_at.slice(0, 10),
    logs:          (logs || []).map(l => ({
      type: l.type,
      date: l.date,
      note: l.note,
    })),
  };
}

// ── 加载当前用户的全部植物（含日志）──
async function loadPlants() {
  if (!configured || !currentUser) return;

  const { data: plantRows, error: pErr } = await sb
    .from('plants')
    .select('*')
    .order('created_at', { ascending: true });

  if (pErr) { showToast('加载植物失败：' + pErr.message); return; }
  if (!plantRows.length) { plants = []; selectedId = null; renderSidebar(); renderDetail(); return; }

  const plantIds = plantRows.map(r => r.id);
  const { data: logRows, error: lErr } = await sb
    .from('logs')
    .select('*')
    .in('plant_id', plantIds)
    .order('date', { ascending: true });

  if (lErr) { showToast('加载日志失败：' + lErr.message); return; }

  // 按 plant_id 分组
  const logsByPlant = {};
  (logRows || []).forEach(l => {
    if (!logsByPlant[l.plant_id]) logsByPlant[l.plant_id] = [];
    logsByPlant[l.plant_id].push(l);
  });

  plants = plantRows.map(row => rowToPlant(row, logsByPlant[row.id] || []));
  selectedId = plants.length ? plants[0].id : null;
  renderSidebar();
  renderDetail();
}

// ── save()：本步骤不再使用，保留空函数避免残留调用报错 ──
function save() {}

function today() { return new Date().toISOString().slice(0,10); }
function daysSince(d) { return Math.floor((new Date() - new Date(d)) / 86400000); }
function fmtDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`;
}

function waterStatus(p) {
  const wl = p.logs.filter(l=>l.type==='water');
  if (!wl.length) return { label:'未浇过水', cls:'overdue' };
  const days = daysSince(wl[wl.length-1].date);
  const pct = days / p.waterInterval;
  if (pct <= 0.5) return { label:`${days}天前浇过`, cls:'ok' };
  if (pct <= 1) return { label:`该考虑浇水了`, cls:'soon' };
  return { label:`已超期 ${days - p.waterInterval} 天`, cls:'overdue' };
}

function renderSidebar() {
  const list = document.getElementById('sidebarList');
  if (!plants.length) { list.innerHTML = '<div style="padding:16px 24px;font-size:12px;color:rgba(255,255,255,0.3)">还没有植物</div>'; return; }
  const clsMap = { ok:'si-status-ok', soon:'si-status-soon', overdue:'si-status-overdue' };
  list.innerHTML = '<div class="sidebar-section-label">我的植物</div>' +
    plants.map(p => {
      const ws = waterStatus(p);
      return `<div class="sidebar-item${p.id===selectedId?' active':''}" onclick="selectPlant(${p.id})">
        <span class="si-emoji">${p.emoji}</span>
        <div class="si-info">
          <div class="si-name">${p.name}</div>
          <div class="si-status ${clsMap[ws.cls]}">${ws.label}</div>
        </div>
      </div>`;
    }).join('');
}

function selectPlant(id) {
  selectedId = id;
  renderSidebar();
  renderDetail();
}

function renderDetail() {
  const content = document.getElementById('mainContent');
  const actions = document.getElementById('topbarActions');
  const titleEl = document.getElementById('topbarTitle');
  const p = plants.find(x=>x.id===selectedId);

  if (!p) {
    titleEl.textContent = '植物日记';
    actions.innerHTML = '';
    content.innerHTML = `<div class="welcome">
      <div class="welcome-icon">🪴</div>
      <h2>开始记录你的植物</h2>
      <p>在左侧选择植物，或添加新的植物开始记录。</p>
      <button class="btn btn-primary" onclick="openAddModal()">添加植物</button>
    </div>`;
    return;
  }

  titleEl.textContent = p.name;
  actions.innerHTML = `
    <button class="btn btn-secondary" onclick="openNoteModal(${p.id})">+ 记录</button>
    <button class="btn btn-primary" onclick="waterNow(${p.id})">💧 记录浇水</button>
    <button class="btn btn-danger" onclick="deletePlant(${p.id})">删除</button>`;

  const ws = waterStatus(p);
  const badgeCls = { ok:'badge-ok', soon:'badge-soon', overdue:'badge-overdue' };
  const lastWater = p.logs.filter(l=>l.type==='water').slice(-1)[0];
  const totalWater = p.logs.filter(l=>l.type==='water').length;
  const totalGrowth = p.logs.filter(l=>l.type==='growth').length;

  const logs = [...p.logs].reverse();
  const typeLabel = { water:'浇水', growth:'生长记录', note:'备注' };
  const dotCls = { water:'tl-dot-water', growth:'tl-dot-growth', note:'tl-dot-note' };
  const typeCls = { water:'tl-type-water', growth:'tl-type-growth', note:'tl-type-note' };

  const timelineHTML = logs.length ? logs.map(l => `
    <div class="tl-item">
      <div class="tl-dot ${dotCls[l.type]}"></div>
      <div class="tl-date">${fmtDate(l.date)}</div>
      <div class="tl-content">
        <span class="tl-type ${typeCls[l.type]}">${typeLabel[l.type]}</span>
        ${l.note ? `<span style="color:var(--ink-muted)"> — ${l.note}</span>` : ''}
      </div>
    </div>`).join('') : '<div class="log-empty">还没有任何记录</div>';

  content.innerHTML = `
    <div class="plant-hero">
      <div class="plant-avatar">${p.emoji}</div>
      <div class="plant-meta">
        <h2>${p.name}</h2>
        <div class="species">${p.species}</div>
        <div class="plant-badges">
          <span class="badge ${badgeCls[ws.cls]}">${ws.label}</span>
          <span class="badge badge-interval">每 ${p.waterInterval} 天浇一次</span>
          <span class="badge badge-interval">养了 ${daysSince(p.added)} 天</span>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">最近浇水</div>
        <div class="stat-value" style="font-size:18px;font-weight:400">${lastWater ? fmtDate(lastWater.date) : '从未'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">浇水次数</div>
        <div class="stat-value">${totalWater}<span class="stat-unit"> 次</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">生长记录</div>
        <div class="stat-value">${totalGrowth}<span class="stat-unit"> 条</span></div>
      </div>
    </div>

    <div class="log-header">
      <h3>养护日志</h3>
    </div>
    <div class="timeline">${timelineHTML}</div>`;
}

async function waterNow(id) {
  const { error } = await sb.from('logs').insert({
    plant_id:   id,
    created_by: currentUser.id,
    type:       'water',
    note:       '',
    date:       today(),
  });
  if (error) { showToast('记录失败：' + error.message); return; }
  await loadPlants();
  selectedId = id;
  renderSidebar(); renderDetail();
  showToast('💧 浇水已记录！');
}

async function deletePlant(id) {
  if (!confirm('确定删除这株植物及其所有记录？')) return;
  const { error } = await sb.from('plants').delete().eq('id', id);
  if (error) { showToast('删除失败：' + error.message); return; }
  await loadPlants();
  showToast('已删除');
}

function openAddModal() {
  selectedEmoji = '🌱';
  setModal(`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>添加新植物</h2>
      <div class="form-group">
        <label>选择图标</label>
        <div class="emoji-grid" id="emojiGrid">
          ${EMOJIS.map(e=>`<button class="emoji-btn${e===selectedEmoji?' active':''}" onclick="pickEmoji(this,'${e}')">${e}</button>`).join('')}
        </div>
      </div>
      <div class="form-group"><label>植物名称</label><input id="f_name" placeholder="给它起个名字"></div>
      <div class="form-group"><label>品种（可选）</label><input id="f_species" placeholder="如：仙人球、绿萝"></div>
      <div class="form-group"><label>浇水间隔（天）</label><input id="f_interval" type="number" min="1" max="90" value="7"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmAdd()">添加</button>
      </div>
    </div>
  </div>`);
}

function pickEmoji(btn, emoji) {
  selectedEmoji = emoji;
  document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

async function confirmAdd() {
  const name = document.getElementById('f_name').value.trim();
  const species = document.getElementById('f_species').value.trim();
  const interval = parseInt(document.getElementById('f_interval').value)||7;
  if (!name) { document.getElementById('f_name').focus(); return; }
  const { data, error } = await sb.from('plants').insert({
    user_id:        currentUser.id,
    name:           name,
    species:        species || '未知品种',
    emoji:          selectedEmoji,
    water_interval: interval,
  }).select().single();
  if (error) { showToast('添加失败：' + error.message); return; }
  closeModal();
  await loadPlants();
  selectedId = data.id;
  renderSidebar(); renderDetail();
  showToast('🌱 植物已添加！');
}

function openNoteModal(id) {
  noteType = 'note';
  setModal(`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2>添加记录</h2>
      <div class="type-switcher">
        <button class="type-btn active" id="tb_note" onclick="setNoteType('note',this)">📝 备注</button>
        <button class="type-btn" id="tb_growth" onclick="setNoteType('growth',this)">🌱 生长</button>
      </div>
      <div class="form-group">
        <label id="noteLabel">备注内容</label>
        <textarea id="noteContent" placeholder="记录今天的状态、发现..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmNote(${id})">保存</button>
      </div>
    </div>
  </div>`);
}

function setNoteType(type, el) {
  noteType = type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('noteLabel').textContent = type==='growth' ? '生长情况' : '备注内容';
  document.getElementById('noteContent').placeholder = type==='growth' ? '描述生长变化，如：长出新叶，高度增加2cm...' : '记录今天的状态、发现...';
}

async function confirmNote(id) {
  const note = document.getElementById('noteContent').value.trim();
  if (!note) { document.getElementById('noteContent').focus(); return; }
  const { error } = await sb.from('logs').insert({
    plant_id:   id,
    created_by: currentUser.id,
    type:       noteType,
    note:       note,
    date:       today(),
  });
  if (error) { showToast('保存失败：' + error.message); return; }
  closeModal();
  await loadPlants();
  selectedId = id;
  renderSidebar(); renderDetail();
  showToast('记录已保存！');
}

function setModal(html) { document.getElementById('modalContainer').innerHTML = html; }
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

// 启动认证流程
initAuth();
</script>
</body>
